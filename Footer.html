<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RNXG Footer</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<footer
  class="footer"
  style="background: url('https://i.redd.it/8iudy7ohrqz51.jpg') center / cover no-repeat;"
>
  <div class="footer_glass">

    <!-- TOP -->
    <div class="div_top">
      <button class="enquiry_btn">Enquiry</button>

      <h1 class="RNXG_Tittle">RNXG</h1>

      <div class="footer_socials">
        <a href="https://www.instagram.com/team_rnxg/"><i class="fab fa-instagram"></i></a>
        <a href="https://in.linkedin.com/company/rnxg"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://www.youtube.com/@rnxg_sggs"><i class="fab fa-youtube"></i></a>
        <a href="#"><i class="fab fa-discord"></i></a>
      </div>
    </div>

    <!-- CENTER -->
    <div class="div_center">
      <img
        src="Character.png"
        class="footer_character"
        alt="GTA Character"
      />

      <p class="footer_text">
        Robotics for Next Generation provides the best platform to work on
        different problem statements and create the best solutions.
      </p>
    </div>

    <!-- BOTTOM -->
    <div class="div_bottom">
      <span>© 2025 RNXG</span>
      <span>Design & Develop by Team RNXG</span>
      <span>info@rmgaddon2025.tech</span>
    </div>

    <!-- GO TO TOP BUTTON -->
    <button
      class="go_top_btn"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
      aria-label="Go to top"
    >
      <img
        src="https://cdn-icons-png.flaticon.com/128/4534/4534738.png"
        alt="Go to top"
      />
    </button>

  </div>
</footer>

<!-- ENQUIRY FORM -->
<div
  class="enquiry_overlay"
  id="enquiry_overlay"
  aria-hidden="true"
  role="dialog"
  aria-labelledby="enquiry_title"
>
  <div class="enquiry_modal">
    <button
      class="enquiry_close_btn"
      id="enquiry_close_btn"
      aria-label="Close enquiry form"
    >
      &times;
    </button>

    <h2 id="enquiry_title">Enquiry</h2>

    <form id="enquiry_form">
      <label>
        Name
        <input type="text" name="name" required />
      </label>

      <label>
        Email
        <input type="email" name="email" required />
      </label>

      <label>
        Subject
        <input
          type="text"
          name="subject"
          class="enquiry_subject_input"
          required
        />
      </label>

      <label>
        Message
        <textarea name="message" rows="4" required></textarea>
      </label>

      <div class="enquiry_actions">
        <button type="submit" class="enquiry_submit_btn">
          Send
        </button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
